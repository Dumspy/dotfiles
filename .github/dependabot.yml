version: 2
updates:
  # Nix updates flake.lock only. After merging one, run `devenv update` so
  # devenv.lock's nixpkgs pin stays next to the system pin (see devenv.yaml).
  # Do not also enable DeterminateSystems/update-flake-lock; it would open a
  # second PR for the same inputs. Review the grouped lock diff before merge.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "flake-updates"
    groups:
      flake-inputs:
        patterns:
          - "*"

  # Actions are pinned to full commit SHAs. Dependabot updates the SHA and the
  # trailing version comment in one grouped pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
