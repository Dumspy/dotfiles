name: Test and Lint Nix Config

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # The Rex flake is fetched from pkgs.superlogical.com, which returns 401
      # without this token. Felix adds the Actions secret REX_PACKAGE_TOKEN.
      # The Nix client (flake fetch) and the daemon (builds) each read a netrc
      # they can access: the runner owns the home file, root owns /etc/nix/netrc.
      - name: Write Rex package netrc
        env:
          REX_PACKAGE_TOKEN: ${{ secrets.REX_PACKAGE_TOKEN }}
        run: |
          if [ -z "${REX_PACKAGE_TOKEN}" ]; then
            echo "::error::GitHub Actions secret REX_PACKAGE_TOKEN is not set. Felix needs to add the Rex package token so CI can fetch the Rex flake (machine pkgs.superlogical.com login rex)."
            exit 1
          fi
          install -d -m 700 "${HOME}/.config/nix"
          printf 'machine pkgs.superlogical.com login rex password %s\n' "${REX_PACKAGE_TOKEN}" > "${HOME}/.config/nix/netrc"
          chmod 600 "${HOME}/.config/nix/netrc"
          sudo install -d -m 755 /etc/nix
          sudo cp "${HOME}/.config/nix/netrc" /etc/nix/netrc
          sudo chmod 600 /etc/nix/netrc
          if ! sudo grep -qxF 'netrc-file = /etc/nix/netrc' /etc/nix/nix.conf; then
            echo 'netrc-file = /etc/nix/netrc' | sudo tee -a /etc/nix/nix.conf >/dev/null
          fi
          sudo systemctl restart nix-daemon
          {
            echo 'NIX_CONFIG<<NIXCFG'
            if [ -n "${NIX_CONFIG:-}" ]; then
              printf '%s\n' "${NIX_CONFIG}"
            fi
            echo "netrc-file = ${HOME}/.config/nix/netrc"
            echo 'NIXCFG'
          } >> "${GITHUB_ENV}"

      # Temporary: print the fetched Rex module so option names can be checked.
      # Remove this step once flake.lock pins rex.
      - name: Inspect Rex flake module
        run: |
          nix flake lock
          echo "===== REX LOCK ====="
          python3 - << 'PY'
          import json
          lock = json.load(open("flake.lock"))
          print(json.dumps({"rex": lock["nodes"]["rex"], "root": lock["nodes"]["root"]["inputs"].get("rex")}, indent=2))
          PY
          meta=$(nix flake prefetch --json "https://pkgs.superlogical.com/rex/nix/preview.tar.gz")
          echo "prefetch: $meta"
          rex=$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["storePath"])')
          echo "rex store: $rex"
          find "$rex" -type f -name '*.nix' | sort | while read -r f; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Verify flake configuration
        run: nix flake check . --all-systems

      - name: Build devenv shell and run git hooks
        run: devenv test
