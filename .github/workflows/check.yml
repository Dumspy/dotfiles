name: Test and Lint Nix Config

# `pull_request` uses the workflow from the merge commit, so a fork can delete
# the `if` on `test`. Also set:
#   Settings → Actions → General → Fork pull request workflows →
#   "Require approval for all outside collaborators"
# GitHub reports a skipped job as success, so that setting is what keeps a
# fork PR from looking green. Do not add pull_request_target.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Configure Nix Authentication
        env:
          REX_PACKAGE_TOKEN: ${{ secrets.REX_PACKAGE_TOKEN }}
        run: |
          # Create user Nix config directory securely
          install -d -m 700 "${HOME}/.config/nix"

          # Write the netrc file
          printf 'machine pkgs.superlogical.com login rex password %s\n' "${REX_PACKAGE_TOKEN}" > "${HOME}/.config/nix/netrc"
          chmod 600 "${HOME}/.config/nix/netrc"

          # Inject netrc-file directly into NIX_CONFIG for subsequent steps
          {
            echo 'NIX_CONFIG<<NIXCFG'
            printf '%s\n' "${NIX_CONFIG:-}"
            echo "netrc-file = ${HOME}/.config/nix/netrc"
            echo 'NIXCFG'
          } >> "${GITHUB_ENV}"

      - name: Verify flake configuration
        run: nix flake check . --all-systems

      - name: Build devenv shell and run git hooks
        run: nix run --accept-flake-config "github:cachix/devenv/$(jq -r .nodes.devenv.locked.rev devenv.lock)" -- test
